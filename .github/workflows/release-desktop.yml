name: release-desktop

# Builds the Atem Overseer desktop tray app (av-launcher shell + embedded Node
# runtime + built app) for macOS (one universal build, Apple Silicon + Intel), Windows
# (x86_64) and Linux (x86_64), and attaches the installers to the release.
#
# macOS is built once on the Apple-Silicon runner as universal-apple-darwin:
# both slices of the launcher are compiled and lipo'd by Tauri, and the
# embedded Node runtime is lipo'd by launcher/scripts/prepare.sh
# (NODE_PLATFORM=darwin-universal). The native Node addons come from
# pkg-prebuilds, which ships one prebuilt binary per architecture inside the
# npm package and picks by os.arch() at run time, so the same app tree serves
# both slices; the gate below checks every Mach-O in the bundle for exactly
# that shape. The Intel macOS runners are retired, so macos-13 is never used.
#
# The macOS bundles leave here ad-hoc signed. The Developer ID key never
# leaves the author's Mac: a watcher there re-signs, notarises and re-uploads
# every new release's macOS assets within a few minutes (stoatworks-backend,
# release/auto-sign-watch.sh). Nothing in this workflow needs a secret.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach installers to (e.g. v0.1.0); an unpushed tag is a dry run'
        required: true
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # universal-apple-darwin is a Tauri bundling target, not a rustup one:
          # rust_targets is what rustup installs, tauri_target what tauri build
          # is given.
          - { name: macos-universal, os: macos-14,       node_platform: darwin-universal, rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin', tauri_target: universal-apple-darwin }
          - { name: windows-x86_64, os: windows-latest, node_platform: win-x64,          rust_targets: x86_64-pc-windows-msvc }
          - { name: linux-x86_64,   os: ubuntu-22.04,   node_platform: linux-x64,        rust_targets: x86_64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install launcher deps
        run: cd launcher && npm ci

      - name: Build + stage embedded app
        shell: bash
        env:
          NODE_PLATFORM: ${{ matrix.node_platform }}
        run: cd launcher && bash scripts/prepare.sh

      - name: Build desktop bundle (macOS)
        if: startsWith(matrix.os, 'macos')
        # --bundles app only: the .dmg and .pkg are built below from a staged
        # copy of the bundle, after the cargo intermediates are reclaimed —
        # hdiutil ran the runner out of space when the image was made in here.
        run: cd launcher && npm run tauri build -- --bundles app --target ${{ matrix.tauri_target }}

      - name: Build desktop bundle (Windows)
        if: startsWith(matrix.os, 'windows')
        run: cd launcher && npm run tauri build

      # AppImage bundling (linuxdeploy) is unreliable on CI runners; ship deb + rpm.
      - name: Build desktop bundle (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: cd launcher && npm run tauri build -- --bundles deb rpm

      # Two full compiles' worth of intermediates plus an embedded Node runtime
      # copied into the .app, the staging dir and the disk image in turn was
      # enough to run a runner out of space during hdiutil. The bundle is built
      # by this point; nothing below needs the intermediates.
      - name: Reclaim disk before packaging
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin ${{ matrix.tauri_target }}; do
            target="launcher/src-tauri/target/$t/release"
            rm -rf "$target/build" "$target/deps" "$target/incremental" "$target/.fingerprint"
          done
          df -h / | tail -1

      # Proof that "universal" is universal, for EVERY Mach-O in the bundle. A
      # fat launcher around a thin embedded runtime launches on an Intel Mac and
      # dies when it starts its server, which is worse than not shipping for
      # Intel at all — the RFutils v0.4.3 failure. Captured and matched with
      # `case`, never piped into grep: steps run as `bash -eo pipefail`, so a
      # grep that exits on its first match SIGPIPEs lipo and fails the step
      # BECAUSE the match was found.
      - name: Verify the macOS launcher is universal
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          appdir="launcher/src-tauri/target/${{ matrix.tauri_target }}/release/bundle/macos"
          app="Atem Overseer.app"
          [ -d "$appdir/$app" ] || { echo "no .app produced" >&2; exit 1; }
          fat=0; paired=0
          while IFS= read -r f; do
            __archs="$( lipo -archs "$f" 2>/dev/null )" || continue
            [ -n "$__archs" ] || continue
            rel="${f#$appdir/$app/}"
            case "$__archs" in
              *arm64*x86_64*|*x86_64*arm64*)
                fat=$((fat+1)); echo "$rel: $__archs" ;;
              *)
                # A pkg-prebuilds addon is one thin file per architecture,
                # chosen by os.arch() at run time: universal means the other
                # slice's prebuild sits in the sibling directory.
                case "$rel" in
                  *prebuilds/*-darwin-arm64/*) other="${f/-darwin-arm64\//-darwin-x64/}" ;;
                  *prebuilds/*-darwin-x64/*)   other="${f/-darwin-x64\//-darwin-arm64/}" ;;
                  *) echo "thin Mach-O outside a prebuilds pair: $rel ($__archs)" >&2; exit 1 ;;
                esac
                [ -f "$other" ] || { echo "$rel has no prebuild for the other architecture" >&2; exit 1; }
                paired=$((paired+1)); echo "$rel: $__archs (paired)" ;;
            esac
          done < <(find "$appdir/$app" -type f \( -perm -u+x -o -name '*.node' \))
          echo "universal Mach-Os: $fat, paired thin prebuilds: $paired"
          # The two that must be fat, by name — a find that matched nothing
          # would otherwise pass in silence.
          for must in "Contents/MacOS/av-launcher" "Contents/Resources/node"; do
            __archs="$( lipo -archs "$appdir/$app/$must" )"
            case "$__archs" in
              *arm64*x86_64*|*x86_64*arm64*) ;;
              *) echo "$must is not universal: $__archs" >&2; exit 1 ;;
            esac
          done

      - name: Installers (macOS)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        # Tauri has no pkg bundler and its dmg step drives Finder, which fails
        # headless, so both come from the fleet's release helper and the same
        # staged .app. Ad-hoc signed here; the Developer ID signature and
        # notarisation are applied post-hoc by the watcher on the author's Mac.
        run: |
          source scripts/release-lib.sh
          version="${{ github.event.inputs.tag || github.ref_name }}"
          version="${version#v}"
          case "$version" in [0-9]*) ;; *) version="$(node -p "require('./package.json').version")" ;; esac
          rl_init "Atem Overseer" atem-overseer "$version" com.stoatworks.atem-overseer "$GITHUB_WORKSPACE/out"
          appdir="launcher/src-tauri/target/${{ matrix.tauri_target }}/release/bundle/macos"
          app="Atem Overseer.app"
          [ -d "$appdir/$app" ] || { echo "no .app produced" >&2; exit 1; }
          stage="$RUNNER_TEMP/stage-pkg"
          rm -rf "$stage"; mkdir -p "$stage" "$GITHUB_WORKSPACE/out"
          cp -R "$appdir/$app" "$stage/"
          rl_adhoc_sign "$stage/$app"
          rl_pkg "${{ matrix.name }}" "$stage" --app "$app"
          rl_dmg "${{ matrix.name }}" "$stage" --app "$app"

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          find launcher/src-tauri/target -type f \
            \( -name '*.dmg' -o -name '*.pkg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) \
            -path '*/release/bundle/*' -exec cp {} out/ \; || true
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: atem-overseer-desktop-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

      # A dispatch naming a tag that has not been pushed is a dry run: every
      # platform builds and the installers are kept as workflow artifacts, and
      # nothing is published. That is how a change to this workflow is proven
      # on all three runners before the next real release.
      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if ! git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "tag $TAG is not pushed — dry run, installers are in the workflow artifacts"
            exit 0
          fi
          extra=""
          case "$TAG" in *-*) extra="--prerelease" ;; esac
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" $extra || true
          gh release upload "$TAG" out/* --clobber
